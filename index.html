<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">Personal Finance</p>
          <h1>Simple Expense Tracker</h1>
          <p class="subtitle">Track daily spending and ask an AI coach for money tips.</p>
        </div>
      </header>

      <main class="content">
        <section class="panel">
          <h2>Add an expense</h2>
          <form id="expense-form" class="expense-form">
            <input id="description" name="description" type="text" placeholder="What was it for?" required />
            <input id="amount" name="amount" type="number" step="0.01" min="0" placeholder="Amount" required />
            <select id="category" name="category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <input id="date" name="date" type="date" required />
            <button type="submit">Add Expense</button>
          </form>
        </section>

        <section class="stats">
          <div class="stat-card">
            <p>Total spent</p>
            <h3 id="total-value">$0.00</h3>
          </div>
          <div class="stat-card">
            <p>Entries</p>
            <h3 id="entry-count">0</h3>
          </div>
          <div class="stat-card">
            <p>Average</p>
            <h3 id="average-value">$0.00</h3>
          </div>
        </section>

        <section class="panel">
          <div class="list-header">
            <h2>Recent expenses</h2>
            <button id="clear-all" class="ghost-btn" type="button">Clear all</button>
          </div>
          <ul id="expense-list" class="expense-list"></ul>
        </section>

        <section class="panel">
          <h2>AI budget coach</h2>
          <p class="helper-text">Enter your OpenAI API key and ask for advice like “How can I save more this month?”</p>
          <input id="api-key" type="password" placeholder="OpenAI API key" />
          <div id="chat-box" class="chat-box"></div>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" type="text" placeholder="Ask the chatbot..." required />
            <button type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
